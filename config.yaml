# MarvisXY 配置文件
# 说明：所有可覆盖项均在此集中管理；环境变量敏感项见 .env.example

# ---------------------------------------------------------------------------
# AI 人设配置
# ---------------------------------------------------------------------------
persona:
  name: "MarvisXY"                    # 助手名称
  description: "多 Agent 协作桌面智能助手"
  user_title: "老板"                  # 对用户的称呼
  style: "理智高效"                   # 回答风格
  greeting: "老板，我在。有什么需要我处理的？"

# ---------------------------------------------------------------------------
# 意图路由规则
# 命中逻辑：文本包含任一 keyword 或命中任一 pattern 即命中该规则；
# 按 priority 升序遍历，返回第一个命中；数字越小优先级越高。
# ---------------------------------------------------------------------------
routing:
  fallback: "main"                    # 无命中时的兜底 Agent
  rules:
    - agent: "file-agent"
      priority: 10
      keywords: ["文件", "文档", "整理", "搜索", "查找", "读写", "归档", "桌面文件", "目录树", "列目录", "项目结构", "分析项目", "当前项目", "项目分析", "分析"]
      patterns: ['\.(txt|md|pdf|docx|xlsx|pptx|py)\b', '\b(ls|tree)\b', '分析.*项目']
    - agent: "app-agent"
      priority: 20
      keywords: ["打开", "启动", "关闭", "卸载", "安装", "应用", "软件", "微信", "浏览器"]
      patterns: ['打开\s*\S+']
    - agent: "browser-agent"
      priority: 30
      keywords: ["网页", "网址", "搜索网页", "打开网站", "在线", "爬取", "浏览网页"]
      patterns: ['https?://', 'www\.']
    - agent: "computer-agent"
      priority: 40
      keywords: ["系统", "设置", "磁盘", "清理系统", "故障", "进程", "网络", "排查", "优化"]
      patterns: ['系统设置', '检查.*(磁盘|内存|网络)']

# ---------------------------------------------------------------------------
# 模型 / LLM 配置（已接入远程 OpenAI 兼容 API）
# api_key 为敏感项，不在本文件填写，由 .env 的 OPENAI_API_KEY 提供
# ---------------------------------------------------------------------------
llm:
  provider: "openai"                 # openai | ollama | 自定义本地 API
  base_url: "https://api.deepseek.com/v1"
  api_key: ""                        # 从 .env 读取 OPENAI_API_KEY
  model: "deepseek-flash"
  temperature: 0.2

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
  file: "logs/marvisxy.log"

# 主控轮次、助手调度及全任务模型/工具调用暂不设次数上限。
orchestration:
  # 助手调度不设总次数上限；同一任务的重复转接防护仍由执行器检查。
  # 各助手独立执行策略的轮次上限。
  agent_rounds:
    coding: 12
    file: 8
    computer: 4
    app: 4
    browser: 6
    search: 6

# 全局上下文规则：主控与所有业务/评测助手共用，压缩助手自身不递归触发。
context_management:
  enabled: true
  # 未指定模型容量时默认假设 256k；models 可按精确模型名覆盖。
  # auto: 常规窗口到边界时摘要；1M 及以上窗口预留 33000（1M -> 967k）。
  # 可设置 auto_compact_window_tokens 提前摘要；超过窗口的值会被封顶。
  # 当前无供应商 tokenizer，使用 UTF-8 字节数 / 2 估算（含工具 schema）。
  window_tokens: 256000
  auto_compact_window_tokens: null
  output_reserve_tokens: 4096
  safety_buffer_tokens: 2048
  micro_ratio: 0.60
  keep_tool_results: 5
  old_tool_chars: 1200
  recent_units: 2
  summary_tokens: 2048
  chunk_tokens: 64000
  max_summary_calls: 128
  compact_instructions: "保留用户限制、修改文件路径、测试命令及结果、拒绝和未完成工作。"
  # 可按精确 model 名称覆盖上述全局配置：
  # models:
  #   large-model:
  #     window_tokens: 1000000   # 默认在约 967000 时摘要
  #   custom-model:
  #     window_tokens: 512000
  #     auto_compact_window_tokens: 400000  # 提前触发

# 用户主动评测功能：普通任务不自动评测；仅显式提交评测对象与要求时运行。
evaluation:
  enabled: true
  threshold: 0.8
  timeout: 120
  # python: /absolute/path/to/python3.12-with-deepeval
  # 默认使用主引擎的当前 Python 解释器，与项目 .venv 保持一致。

# 跨会话长期记忆：SQLite 保留执行树，OpenViking 负责记忆提取与语义检索。
# App/TUI 自动启动原生服务；external 可连接已有或 Docker 服务。
memory:
  enabled: true
  backend: openviking
  deployment: managed
  url: "http://127.0.0.1:1933"
  auth_mode: trusted             # 本地 compose；托管服务使用 api_key
  account: marvis
  user: marvisxy                 # 相同 account/user 共享长期记忆
  timeout: 3
  recall_limit: 5
  recall_chars: 6000
  retry_seconds: 30
  managed:
    startup_timeout: 90
    max_restarts: 3
