{
  "storage": {"workspace": "/app/.openviking/data"},
  "server": {
    "host": "0.0.0.0",
    "port": 1933,
    "auth_mode": "trusted",
    "root_api_key": "${OPENVIKING_ROOT_API_KEY}"
  },
  "embedding": {
    "dense": {
      "provider": "local",
      "model": "bge-small-zh-v1.5-f16"
    }
  },
  "vlm": {
    "provider": "openai",
    "api_base": "${OPENVIKING_VLM_BASE_URL}",
    "model": "${OPENVIKING_VLM_MODEL}",
    "api_key": "${OPENVIKING_VLM_API_KEY}",
    "temperature": 0
  }
}
